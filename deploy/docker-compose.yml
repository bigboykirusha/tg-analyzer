# Production on one server: site, API, worker, Postgres, Redis and Caddy (HTTPS).
# Run from this folder: `docker compose up -d --build` (deploy/update.sh does it for you).
# Settings live in deploy/.env (created by deploy/setup.sh from .env.example).
name: tganalyzer

x-api-env: &api-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://tganalyzer:${POSTGRES_PASSWORD}@postgres:5432/tganalyzer
  REDIS_URL: redis://redis:6379
  TELEGRAM_MODE: live
  TELEGRAM_API_ID: ${TELEGRAM_API_ID}
  TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
  SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY}
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  API_HOST: 0.0.0.0
  API_PORT: 3001
  CORS_ORIGIN: https://${SITE_HOST}
  APP_URL: https://${SITE_HOST}
  COOKIE_SECURE: 'true'
  FREE_ANALYSES_PER_DAY: ${FREE_ANALYSES_PER_DAY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
  ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tganalyzer
      POSTGRES_USER: tganalyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tganalyzer -d tganalyzer']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The job queue must never lose keys to eviction; appendonly survives restarts.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    image: tganalyzer-api
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgresql://tganalyzer:${POSTGRES_PASSWORD}@postgres:5432/tganalyzer
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: tganalyzer-api
    restart: unless-stopped
    environment: *api-env
    depends_on: &api-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logging

  worker:
    image: tganalyzer-api
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment: *api-env
    depends_on: *api-deps
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Empty: the browser opens the progress socket on the site's own address (Caddy passes /ws to the API).
        NUXT_PUBLIC_WS_URL: ''
        NUXT_PUBLIC_SITE_URL: https://${SITE_HOST}
    restart: unless-stopped
    environment:
      NUXT_API_PROXY_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
