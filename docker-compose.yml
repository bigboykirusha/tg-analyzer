services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tganalyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tganalyzer']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/tganalyzer
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: pnpm --filter @tg-analyzer/api worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/tganalyzer
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:3001
      NUXT_PUBLIC_WS_URL: ws://localhost:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

  bull-board:
    image: deadly0/bull-board
    profiles:
      - tools
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    ports:
      - '3002:3000'

volumes:
  postgres_data:
  redis_data:
