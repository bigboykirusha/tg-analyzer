services:
  - type: web
    name: tg-analyzer-api
    runtime: node
    region: frankfurt
    plan: standard
    branch: main
    buildCommand: corepack pnpm install && corepack pnpm --filter @tg-analyzer/shared build && corepack pnpm --filter @tg-analyzer/api build
    startCommand: corepack pnpm --filter @tg-analyzer/api start
    envVars:
      - fromGroup: tg-analyzer-shared
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
    autoDeploy: yes
    healthCheckPath: /health
    domains: []

  - type: web
    name: tg-analyzer-web
    runtime: node
    region: frankfurt
    plan: standard
    branch: main
    buildCommand: corepack pnpm install && corepack pnpm --filter @tg-analyzer/shared build && corepack pnpm --filter @tg-analyzer/web build
    startCommand: corepack pnpm --filter @tg-analyzer/web start
    envVars:
      - fromGroup: tg-analyzer-shared
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: NUXT_PUBLIC_SITE_URL
        sync: false
      - key: NUXT_PUBLIC_API_URL
        sync: false
      - key: NUXT_PUBLIC_WS_URL
        sync: false
      - key: NUXT_API_PROXY_TARGET
        sync: false
      - key: NUXT_WS_PROXY_TARGET
        sync: false
      - key: NUXT_PUBLIC_WS_DIRECT_URL
        sync: false
    autoDeploy: yes

  - type: worker
    name: tg-analyzer-worker
    runtime: node
    region: frankfurt
    plan: standard
    branch: main
    buildCommand: corepack pnpm install && corepack pnpm --filter @tg-analyzer/shared build && corepack pnpm --filter @tg-analyzer/api build
    startCommand: corepack pnpm --filter @tg-analyzer/api worker
    envVars:
      - fromGroup: tg-analyzer-shared
      - key: NODE_ENV
        value: production
    autoDeploy: yes

envVarGroups:
  - name: tg-analyzer-shared
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: lax
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_RATE_LIMIT_MAX
        value: '5'
      - key: AUTH_RATE_LIMIT_WINDOW
        value: 1 minute
      - key: FULL_PARSE_COOLDOWN_HOURS
        value: '24'
      - key: DATA_RETENTION_DAYS
        value: '365'
      - key: NODE_OPTIONS
        value: --max-old-space-size=2048
