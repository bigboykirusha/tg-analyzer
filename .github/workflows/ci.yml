name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm format:check
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tganalyzer_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: integration-only
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d tganalyzer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
          run_install: false
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --filter @tg-analyzer/web exec playwright install --with-deps chromium
      - run: corepack pnpm --filter @tg-analyzer/web test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results
          if-no-files-found: ignore
